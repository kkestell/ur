[package]
name = "ur-app"
edition.workspace = true
version.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tokio.workspace = true
ts-rs.workspace = true
ur-client.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }

[features]
# An embedded WebDriver server for automated GUI checks, which also keeps the
# app in the background on macOS. Never ship it.
webdriver = ["dep:tauri-plugin-wdio-webdriver", "dep:objc2"]
