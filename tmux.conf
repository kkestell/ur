set -g mouse on
set -g history-limit 50000
set -g default-command 'export PATH="${XDG_CONFIG_HOME:-$HOME/.config}/ur/bin:$PATH"; exec "$SHELL"'
set -g status-style bg=brightblack,fg=black
set -g status-left ''
set -g status-right ''
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-format ' #{pane_index} #{pane_title} '
set -g pane-active-border-style 'fg=#{E:@ur-window-color}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
set -g focus-events on
set -g @ox-tui-marks '#{P:#{?#{==:#{pane_title},ox-tui: needs permission},#[fg=black]#[bg=yellow] ? #[fg=default]#[bg=default] ,#{?#{==:#{pane_title},ox-tui: finished},#[fg=black]#[bg=green] ✓ #[fg=default]#[bg=default] ,#{?#{==:#{pane_title},ox-tui: turn error},#[fg=black]#[bg=red] ✗ #[fg=default]#[bg=default] ,}}}}'
set -g @agent-marks '#{P:#{?#{==:#{@agent-attention},permission},#[fg=black]#[bg=yellow] ? #[fg=default]#[bg=default] ,#{?#{==:#{@agent-attention},finished},#[fg=black]#[bg=green] ✓ #[fg=default]#[bg=default] ,#{?#{==:#{@agent-attention},error},#[fg=black]#[bg=red] ✗ #[fg=default]#[bg=default] ,}}}}'
set -g @ur-window-color '#{?#{==:#{e|m:#{window_index},14},0},#89b4fa,#{?#{==:#{e|m:#{window_index},14},1},#fab387,#{?#{==:#{e|m:#{window_index},14},2},#cba6f7,#{?#{==:#{e|m:#{window_index},14},3},#a6e3a1,#{?#{==:#{e|m:#{window_index},14},4},#f5c2e7,#{?#{==:#{e|m:#{window_index},14},5},#89dceb,#{?#{==:#{e|m:#{window_index},14},6},#f9e2af,#{?#{==:#{e|m:#{window_index},14},7},#b4befe,#{?#{==:#{e|m:#{window_index},14},8},#f38ba8,#{?#{==:#{e|m:#{window_index},14},9},#94e2d5,#{?#{==:#{e|m:#{window_index},14},10},#f2cdcd,#{?#{==:#{e|m:#{window_index},14},11},#74c7ec,#{?#{==:#{e|m:#{window_index},14},12},#eba0ac,#f5e0dc}}}}}}}}}}}}}'
set -g window-status-separator ''
set -g window-status-format '#[fg=black,bg=#{E:@ur-window-color}]#[push-default] #I #W #{E:@ox-tui-marks}#{E:@agent-marks}'
set -g window-status-current-format '#[fg=black,bg=#{E:@ur-window-color}]#[push-default]#[bold] #I #W #[nobold]#{E:@ox-tui-marks}#{E:@agent-marks}'
set -g window-status-bell-style default
set-hook -g pane-focus-in[90] { set -p @ur-focused 1 ; if -F '#{||:#{==:#{@agent-attention},finished},#{==:#{@agent-attention},error}}' 'set -p @agent-attention ""' }
set-hook -g pane-focus-out[90] { set -p @ur-focused 0 }
set -g automatic-rename-format '#{b:pane_current_path}'
set -g remain-on-exit on
set-hook -g pane-died "if -F '#{&&:#{@workspace},#{==:#{window_panes},1}}' respawn-pane kill-pane"
bind & if -F '#{@workspace}' 'display "Workspace windows stay open"' 'confirm-before -p "kill-window #W? (y/n)" kill-window'
bind x if -F '#{&&:#{@workspace},#{==:#{window_panes},1}}' 'display "Workspace windows stay open"' 'confirm-before -p "kill-pane #P? (y/n)" kill-pane'
if -F '#{==:#{server_sessions},0}' 'source-file -q ~/.config/ur/tmux.conf'
