name: Release macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - name: Install app dependencies
        run: pnpm -C app install --frozen-lockfile
      - name: Check code
        run: make check
      - name: Run GUI tests on the runner
        run: make e2e
      - name: Build unsigned DMG
        run: scripts/build-macos
      - name: Publish runner-built DMG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/release/bundle/dmg/ur-macos-arm64.dmg \
            --verify-tag \
            --title "ur $GITHUB_REF_NAME" \
            --generate-notes
