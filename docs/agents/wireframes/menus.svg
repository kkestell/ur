<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="450" viewBox="0 0 1230 450" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#ccc">
  <defs>
    <style>
      .rule { stroke: #3a3a3a; fill: none; }
      .frame { stroke: #444; fill: #1e1e1e; }
      .bar { fill: #3a3a3a; }
      .muted { fill: #808080; }
      .bold { font-weight: 600; }
      .mono { font-family: Menlo, monospace; white-space: pre; }
      .num { fill: #1e1e1e; stroke: #999; }
      .num-text { font-size: 10px; text-anchor: middle; }
      .icon { color: #ccc; }
      .icon-muted { color: #808080; }
    </style>
    <symbol id="sparkle" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M6 .5 7.3 4.7 11.5 6 7.3 7.3 6 11.5 4.7 7.3 .5 6 4.7 4.7Z"/></symbol>
    <symbol id="bulb" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="5" r="3.5"/><path d="M4.5 10.5h3"/></symbol>
    <symbol id="search" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="5" cy="5" r="3.5"/><path d="M7.6 7.6 11 11"/></symbol>
    <symbol id="pencil" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1.5 10.5 2 8 8.5 1.5l2 2L4 10Z"/></symbol>
    <symbol id="plus" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></symbol>
    <symbol id="expand" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M7 1h4v4M5 11H1V7M11 1 7 5M1 11l4-4"/></symbol>
    <symbol id="dots" viewBox="0 0 12 12" fill="currentColor"><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/></symbol>
    <symbol id="send" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1 1.5 11 6 1 10.5 2.8 6Z"/></symbol>
    <symbol id="ring" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="5"/></symbol>
    <symbol id="target" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M6 .5v2.5M6 9v2.5M.5 6H3M9 6h2.5"/></symbol>
    <symbol id="copy" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><path d="M1.5 8V2.5a1 1 0 0 1 1-1H8"/></symbol>
    <symbol id="terminal" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M3 4.5 5 6 3 7.5M6 8h3"/></symbol>
    <symbol id="split" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M6 1.5v9"/></symbol>
    <symbol id="spinner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 2a4 4 0 1 1-4 4"/></symbol>
    <symbol id="cross" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3 3 9"/></symbol>
    <symbol id="alert" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="5"/><path d="M6 3.2v3.4M6 8.7v.1"/></symbol>
      <symbol id="image" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M.5 9 4 5.5 7 8.5 8.5 7 11.5 10"/><circle cx="8.5" cy="4.5" r="1"/></symbol>
    <symbol id="check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 4.8 9 10 3"/></symbol>
  </defs>

  <rect width="1230" height="450" fill="#151515"/>
  <!-- 1. Workspace menu -->
  <circle cx="48" cy="36" r="8" class="num"/><text x="48" y="40" class="num-text">1</text>
  <text x="62" y="40" class="muted" font-size="11">Workspace menu</text>
  <rect x="40" y="50" width="240" height="300" class="frame"/>
  <text x="52" y="69" class="muted" font-size="11">Workspaces</text>
  <use href="#plus" x="256" y="60" width="11" height="11" class="icon-muted"/>
  <rect x="41" y="84" width="238" height="24" fill="#2c2c2c"/>
  <text x="52" y="100">▾</text><text x="66" y="100">ox</text>
  <text x="266" y="100" class="muted" text-anchor="end">1</text>
  <line x1="58" y1="108" x2="58" y2="154" class="rule"/>
  <text x="72" y="124">Add subagents review</text>
  <circle cx="262" cy="120" r="3.5" fill="#74ade8"/>
  <text x="72" y="148">Fix compaction cut</text>
  <use href="#spinner" x="256" y="138" width="12" height="12" class="icon"/>
  <text x="52" y="180">▾</text><text x="66" y="180">ur</text>
  <text x="266" y="180" class="muted" text-anchor="end">1</text>
  <line x1="58" y1="188" x2="58" y2="234" class="rule"/>
  <text x="72" y="204" class="bold">Plan milestone 2</text>
  <text x="72" y="228">Reject oversized frames</text>
  <text x="52" y="260">▾</text><text x="66" y="260">site</text>
  <text x="266" y="260" class="muted" text-anchor="end">1</text>
  <line x1="58" y1="268" x2="58" y2="314" class="rule"/>
  <text x="72" y="284">Deploy script</text>
  <use href="#alert" x="256" y="274" width="12" height="12" class="icon"/>
  <text x="72" y="308">Update deps</text>
  <rect x="110" y="106" width="190" height="92" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="124" y="127">New Session</text>
  <text x="124" y="151">New Terminal</text>
  <line x1="110" y1="164" x2="300" y2="164" class="rule"/>
  <text x="124" y="187">Remove Workspace</text>

  <!-- 2. Session menu -->
  <circle cx="308" cy="36" r="8" class="num"/><text x="308" y="40" class="num-text">2</text>
  <text x="322" y="40" class="muted" font-size="11">Session menu</text>
  <rect x="300" y="50" width="240" height="300" class="frame"/>
  <text x="312" y="69" class="muted" font-size="11">Workspaces</text>
  <use href="#plus" x="516" y="60" width="11" height="11" class="icon-muted"/>
  <text x="312" y="100">▾</text><text x="326" y="100">ox</text>
  <text x="526" y="100" class="muted" text-anchor="end">1</text>
  <line x1="318" y1="108" x2="318" y2="154" class="rule"/>
  <text x="332" y="124">Add subagents review</text>
  <circle cx="522" cy="120" r="3.5" fill="#74ade8"/>
  <rect x="301" y="132" width="238" height="24" fill="#2c2c2c"/>
  <text x="332" y="148">Fix compaction cut</text>
  <use href="#spinner" x="516" y="138" width="12" height="12" class="icon"/>
  <text x="312" y="180">▾</text><text x="326" y="180">ur</text>
  <text x="526" y="180" class="muted" text-anchor="end">1</text>
  <line x1="318" y1="188" x2="318" y2="234" class="rule"/>
  <text x="332" y="204" class="bold">Plan milestone 2</text>
  <text x="332" y="228">Reject oversized frames</text>
  <text x="312" y="260">▾</text><text x="326" y="260">site</text>
  <text x="526" y="260" class="muted" text-anchor="end">1</text>
  <line x1="318" y1="268" x2="318" y2="314" class="rule"/>
  <text x="332" y="284">Deploy script</text>
  <use href="#alert" x="516" y="274" width="12" height="12" class="icon"/>
  <text x="332" y="308">Update deps</text>
  <rect x="400" y="156" width="130" height="32" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="414" y="177">Delete…</text>

  <!-- 3. Delete confirmation -->
  <circle cx="568" cy="36" r="8" class="num"/><text x="568" y="40" class="num-text">3</text>
  <text x="582" y="40" class="muted" font-size="11">Delete confirmation</text>
  <rect x="560" y="50" width="620" height="300" fill="#181818" stroke="#444"/>
  <rect x="610" y="116" width="520" height="156" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/>
  <text x="626" y="146" class="bold">Delete session?</text>
  <text x="626" y="174">Delete “Fix compaction cut” and its saved transcript?</text>
  <text x="626" y="194" class="muted">Its running turn will be cancelled.</text>
  <rect x="958" y="228" width="72" height="26" rx="4" fill="#2c2c2c"/>
  <text x="994" y="245" text-anchor="middle">Cancel</text>
  <rect x="1042" y="228" width="72" height="26" rx="4" fill="#444"/>
  <text x="1078" y="245" class="bold" text-anchor="middle">Delete</text>

  <!-- Key -->
  <g font-size="11">
    <circle cx="48" cy="390" r="8" class="num"/><text x="48" y="394" class="num-text">1</text>
    <text x="64" y="394">The workspace menu creates sessions and terminals or removes the workspace.</text>
    <circle cx="48" cy="414" r="8" class="num"/><text x="48" y="418" class="num-text">2</text>
    <text x="64" y="418">Sessions appear in the sidebar. Click to view; right-click to delete.</text>
    <circle cx="640" cy="390" r="8" class="num"/><text x="640" y="394" class="num-text">3</text>
    <text x="656" y="394">Delete removes the session and saved transcript from the server, when supported.</text>
    <text x="656" y="410">A running turn is cancelled first.</text>
  </g>
</svg>
