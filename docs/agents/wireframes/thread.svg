<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="1000" viewBox="0 0 1230 1000" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#ccc">
  <defs>
    <style>
      .rule { stroke: #3a3a3a; fill: none; }
      .frame { stroke: #444; fill: #1e1e1e; }
      .bar { fill: #3a3a3a; }
      .muted { fill: #808080; }
      .bold { font-weight: 600; }
      .mono { font-family: Menlo, monospace; white-space: pre; }
      .num { fill: #1e1e1e; stroke: #999; }
      .num-text { font-size: 10px; text-anchor: middle; }
      .icon { color: #ccc; }
      .icon-muted { color: #808080; }
    </style>
    <symbol id="sparkle" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M6 .5 7.3 4.7 11.5 6 7.3 7.3 6 11.5 4.7 7.3 .5 6 4.7 4.7Z"/></symbol>
    <symbol id="bulb" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="5" r="3.5"/><path d="M4.5 10.5h3"/></symbol>
    <symbol id="search" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="5" cy="5" r="3.5"/><path d="M7.6 7.6 11 11"/></symbol>
    <symbol id="pencil" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1.5 10.5 2 8 8.5 1.5l2 2L4 10Z"/></symbol>
    <symbol id="plus" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></symbol>
    <symbol id="expand" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M7 1h4v4M5 11H1V7M11 1 7 5M1 11l4-4"/></symbol>
    <symbol id="dots" viewBox="0 0 12 12" fill="currentColor"><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/></symbol>
    <symbol id="send" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1 1.5 11 6 1 10.5 2.8 6Z"/></symbol>
    <symbol id="ring" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="5"/></symbol>
    <symbol id="target" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M6 .5v2.5M6 9v2.5M.5 6H3M9 6h2.5"/></symbol>
    <symbol id="copy" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><path d="M1.5 8V2.5a1 1 0 0 1 1-1H8"/></symbol>
    <symbol id="terminal" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M3 4.5 5 6 3 7.5M6 8h3"/></symbol>
    <symbol id="split" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M6 1.5v9"/></symbol>
    <symbol id="spinner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 2a4 4 0 1 1-4 4"/></symbol>
    <symbol id="cross" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3 3 9"/></symbol>
    <symbol id="alert" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="5"/><path d="M6 3.2v3.4M6 8.7v.1"/></symbol>
      <symbol id="image" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M.5 9 4 5.5 7 8.5 8.5 7 11.5 10"/><circle cx="8.5" cy="4.5" r="1"/></symbol>
    <symbol id="check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 4.8 9 10 3"/></symbol>
  </defs>

  <rect width="1230" height="1000" fill="#151515"/>
  <rect x="40" y="20" width="1140" height="900" class="frame"/>
  <line x1="40" y1="48" x2="1180" y2="48" class="rule"/>
  <circle cx="58" cy="34" r="5" class="rule"/><circle cx="74" cy="34" r="5" class="rule"/><circle cx="90" cy="34" r="5" class="rule"/>
  <text x="112" y="38" class="bold">ur</text>

  <!-- Workspace panel -->
  <line x1="280" y1="48" x2="280" y2="920" class="rule"/>
  <text x="52" y="67" class="muted" font-size="11">Workspaces</text>
  <use href="#plus" x="256" y="58" width="11" height="11" class="icon-muted"/>
  <text x="52" y="98">▾</text><text x="66" y="98">ox</text>
  <text x="266" y="98" class="muted" text-anchor="end">1</text>
  <line x1="58" y1="106" x2="58" y2="152" class="rule"/>
  <text x="72" y="122">Add subagents review</text>
  <circle cx="262" cy="118" r="3.5" fill="#74ade8"/>
  <text x="72" y="146">Fix compaction cut</text>
  <use href="#spinner" x="256" y="136" width="12" height="12" class="icon"/>
  <text x="52" y="178">▾</text><text x="66" y="178">ur</text>
  <text x="266" y="178" class="muted" text-anchor="end">2</text>
  <line x1="58" y1="186" x2="58" y2="232" class="rule"/>
  <text x="72" y="202" class="bold">Plan milestone 2</text>
  <rect x="41" y="210" width="238" height="24" fill="#2c2c2c"/>
  <text x="72" y="226">Reject oversized frames</text>
  <use href="#alert" x="256" y="216" width="12" height="12" class="icon"/>
  <text x="52" y="258">▾</text><text x="66" y="258">site</text>
  <text x="266" y="258" class="muted" text-anchor="end">1</text>
  <line x1="58" y1="266" x2="58" y2="312" class="rule"/>
  <text x="72" y="282">Deploy script</text>
  <use href="#alert" x="256" y="272" width="12" height="12" class="icon"/>
  <text x="72" y="306">Update deps</text>

  <!-- Thread header -->
  <text x="296" y="68">Reject oversized frames</text>
  <use href="#plus" x="1156" y="58" width="12" height="12" class="icon"/>
  <line x1="280" y1="80" x2="1180" y2="80" class="rule"/>

  <rect x="296" y="94" width="868" height="40" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="312" y="119" class="mono" xml:space="preserve">Make the frame reader reject payloads over 16 MiB.</text>

  <!-- Thinking, expanded -->
  <use href="#bulb" x="312" y="152" width="12" height="12" class="icon"/>
  <text x="332" y="162">Thinking</text>
  <line x1="318" y1="174" x2="318" y2="220" class="rule"/>
  <rect x="332" y="178" width="700" height="9" fill="#2e2e2e"/>
  <rect x="332" y="194" width="640" height="9" fill="#2e2e2e"/>
  <rect x="332" y="210" width="300" height="9" fill="#2e2e2e"/>

  <use href="#search" x="316" y="236" width="12" height="12" class="icon"/>
  <text x="336" y="246">Read src/protocol.rs</text>

  <!-- Edit, expanded -->
  <use href="#pencil" x="316" y="262" width="12" height="12" class="icon"/>
  <text x="336" y="272">Apply patch to src/protocol.rs</text>
  <rect x="312" y="284" width="836" height="58" rx="4" fill="none" stroke="#3a3a3a"/>
  <text x="326" y="307" class="mono muted" font-size="11" xml:space="preserve">Applied patch.</text>
  <text x="326" y="325" class="mono muted" font-size="11" xml:space="preserve">Modified src/protocol.rs</text>

  <g transform="translate(0,-78)">
  <rect x="312" y="438" width="780" height="9" class="bar"/>
  <rect x="312" y="454" width="420" height="9" class="bar"/>

  <!-- Run Command, expanded -->
  <rect x="312" y="474" width="836" height="134" rx="4" fill="#2a2a2a"/>
  <text x="326" y="492" class="mono muted" font-size="10.5" xml:space="preserve">Run Command</text>
  <text x="326" y="513" class="mono" xml:space="preserve">cargo test protocol</text>
  <line x1="312" y1="528" x2="1148" y2="528" class="rule"/>
  <text x="326" y="548" class="mono muted" font-size="11" xml:space="preserve">running 4 tests</text>
  <text x="326" y="564" class="mono muted" font-size="11" xml:space="preserve">test protocol::tests::rejects_oversized_frame ... ok</text>
  <text x="326" y="580" class="mono muted" font-size="11" xml:space="preserve">test protocol::tests::round_trips_json ... ok</text>
  <text x="326" y="596" class="mono muted" font-size="11" xml:space="preserve">test result: ok. 4 passed; 0 failed; 0 ignored</text>

  <rect x="312" y="626" width="560" height="9" class="bar"/>
  <use href="#copy" x="1136" y="642" width="12" height="12" class="icon-muted"/>

  <!-- Rejected prompt -->
  <rect x="296" y="672" width="868" height="62" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="312" y="694" class="mono" xml:space="preserve">Match the error text to this screenshot.</text>
  <rect x="312" y="704" width="128" height="20" rx="3" fill="#333"/>
  <use href="#image" x="318" y="708" width="12" height="12" class="icon"/>
  <text x="336" y="718" font-size="11">screenshot.png</text>
  <rect x="296" y="744" width="868" height="36" rx="4" fill="none" stroke="#3a3a3a"/>
  <use href="#alert" x="310" y="756" width="12" height="12" class="icon"/>
  <text x="330" y="766">Prompt rejected: the selected model does not accept images.</text>
  </g>

  <!-- Message editor -->
  <line x1="280" y1="800" x2="1180" y2="800" class="rule"/>
  <text x="300" y="830" class="mono muted" xml:space="preserve">Message agent — / for commands</text>
  <use href="#ring" x="878" y="888" width="12" height="12" class="icon-muted"/>
  <text x="898" y="898">glm-5.3-flash ⌄</text>
  <text x="1014" y="898">Default ⌄</text>
  <text x="1084" y="898">Ask ⌄</text>
  <use href="#send" x="1148" y="888" width="12" height="12" class="icon"/>

  <!-- Callouts -->
  <circle cx="1204" cy="196" r="8" class="num"/><text x="1204" y="200" class="num-text">1</text>
  <circle cx="1204" cy="314" r="8" class="num"/><text x="1204" y="318" class="num-text">2</text>
  <circle cx="1204" cy="484" r="8" class="num"/><text x="1204" y="488" class="num-text">3</text>
  <circle cx="1204" cy="648" r="8" class="num"/><text x="1204" y="652" class="num-text">4</text>

  <!-- Key -->
  <g font-size="11">
    <circle cx="48" cy="950" r="8" class="num"/><text x="48" y="954" class="num-text">1</text>
    <text x="64" y="954">An expanded Thinking row shows the thought. Clicking the row again collapses it.</text>
    <circle cx="48" cy="974" r="8" class="num"/><text x="48" y="978" class="num-text">2</text>
    <text x="64" y="978">An expanded edit shows the tool's outcome text, like other tool calls.</text>
    <circle cx="640" cy="950" r="8" class="num"/><text x="640" y="954" class="num-text">3</text>
    <text x="656" y="954">An expanded Run Command block shows the command's output under the command.</text>
    <circle cx="640" cy="974" r="8" class="num"/><text x="640" y="978" class="num-text">4</text>
    <text x="656" y="978">A rejected prompt keeps its message, with attachments as chips, and shows the error under it.</text>
  </g>
</svg>
