<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="860" viewBox="0 0 1230 860" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#ccc">
  <defs>
    <style>
      .rule { stroke: #3a3a3a; fill: none; }
      .frame { stroke: #444; fill: #1e1e1e; }
      .bar { fill: #3a3a3a; }
      .muted { fill: #808080; }
      .bold { font-weight: 600; }
      .mono { font-family: Menlo, monospace; white-space: pre; }
      .num { fill: #1e1e1e; stroke: #999; }
      .num-text { font-size: 10px; text-anchor: middle; }
      .icon { color: #ccc; }
      .icon-muted { color: #808080; }
    </style>
    <symbol id="sparkle" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M6 .5 7.3 4.7 11.5 6 7.3 7.3 6 11.5 4.7 7.3 .5 6 4.7 4.7Z"/></symbol>
    <symbol id="bulb" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="5" r="3.5"/><path d="M4.5 10.5h3"/></symbol>
    <symbol id="search" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="5" cy="5" r="3.5"/><path d="M7.6 7.6 11 11"/></symbol>
    <symbol id="pencil" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1.5 10.5 2 8 8.5 1.5l2 2L4 10Z"/></symbol>
    <symbol id="plus" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></symbol>
    <symbol id="expand" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M7 1h4v4M5 11H1V7M11 1 7 5M1 11l4-4"/></symbol>
    <symbol id="dots" viewBox="0 0 12 12" fill="currentColor"><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/></symbol>
    <symbol id="send" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1 1.5 11 6 1 10.5 2.8 6Z"/></symbol>
    <symbol id="ring" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="5"/></symbol>
    <symbol id="target" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M6 .5v2.5M6 9v2.5M.5 6H3M9 6h2.5"/></symbol>
    <symbol id="copy" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><path d="M1.5 8V2.5a1 1 0 0 1 1-1H8"/></symbol>
    <symbol id="terminal" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M3 4.5 5 6 3 7.5M6 8h3"/></symbol>
    <symbol id="split" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M6 1.5v9"/></symbol>
    <symbol id="spinner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 2a4 4 0 1 1-4 4"/></symbol>
    <symbol id="cross" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3 3 9"/></symbol>
    <symbol id="alert" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="5"/><path d="M6 3.2v3.4M6 8.7v.1"/></symbol>
  </defs>

  <rect width="1230" height="860" fill="#151515"/>
  <rect x="40" y="20" width="1140" height="680" class="frame"/>

  <!-- Title bar -->
  <line x1="40" y1="48" x2="1180" y2="48" class="rule"/>
  <circle cx="58" cy="34" r="5" class="rule"/><circle cx="74" cy="34" r="5" class="rule"/><circle cx="90" cy="34" r="5" class="rule"/>
  <text x="112" y="38" class="bold">ur</text>


  <!-- Workspace panel -->
  <line x1="280" y1="48" x2="280" y2="700" class="rule"/>
  <text x="52" y="67" class="muted" font-size="11">Workspaces</text>
  <use href="#plus" x="256" y="58" width="11" height="11" class="icon-muted"/>

  <text x="52" y="98">▾</text><text x="66" y="98">ox</text>
  <text x="266" y="98" text-anchor="end" class="muted">1</text>
  <line x1="58" y1="106" x2="58" y2="152" class="rule"/>
  <text x="72" y="122">Add subagents review</text>
  <circle cx="262" cy="118" r="3.5" fill="#74ade8"/>
  <text x="72" y="146">Fix compaction cut</text>
  <use href="#spinner" x="256" y="136" width="12" height="12" class="icon"/>

  <text x="52" y="178">▾</text><text x="66" y="178">ur</text>
  <text x="266" y="178" text-anchor="end" class="muted">1</text>
  <line x1="58" y1="186" x2="58" y2="232" class="rule"/>
  <text x="72" y="202" class="bold">Plan milestone 2</text>
  <rect x="41" y="210" width="238" height="24" fill="#2c2c2c"/>
  <text x="72" y="226">Wire protocol v2</text>

  <text x="52" y="258">▾</text><text x="66" y="258">site</text>
  <text x="266" y="258" text-anchor="end" class="muted">1</text>
  <line x1="58" y1="266" x2="58" y2="312" class="rule"/>
  <text x="72" y="282">Deploy script</text>
  <use href="#alert" x="256" y="272" width="12" height="12" class="icon"/>
  <text x="72" y="306">Update deps</text>

  <!-- Thread header -->
  <text x="296" y="68">Sketch the JSON frame types for the daemon protocol.</text>
  <use href="#plus" x="1156" y="58" width="12" height="12" class="icon"/>
  <line x1="280" y1="80" x2="1180" y2="80" class="rule"/>

  <!-- User message -->
  <rect x="296" y="94" width="868" height="40" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="312" y="119" class="mono">Sketch the JSON frame types for the daemon protocol.</text>

  <!-- Thinking, collapsed -->
  <use href="#bulb" x="312" y="152" width="12" height="12" class="icon"/>
  <text x="332" y="162">Thinking</text>

  <!-- Agent message -->
  <rect x="312" y="180" width="760" height="9" class="bar"/>
  <rect x="312" y="196" width="520" height="9" class="bar"/>

  <!-- Shell command -->
  <rect x="312" y="216" width="836" height="50" rx="4" fill="#2a2a2a"/>
  <text x="326" y="234" class="mono muted" font-size="10.5">Run Command</text>
  <text x="326" y="255" class="mono">cargo check</text>

  <!-- Other tool calls -->
  <use href="#search" x="316" y="278" width="12" height="12" class="icon"/>
  <text x="336" y="288">Find files matching src/*.rs</text>
  <use href="#search" x="316" y="304" width="12" height="12" class="icon"/>
  <text x="336" y="314">Search for Frame in src</text>
  <use href="#search" x="316" y="330" width="12" height="12" class="icon"/>
  <text x="336" y="340">Read src/protocol.rs</text>
  <use href="#pencil" x="316" y="356" width="12" height="12" class="icon"/>
  <text x="336" y="366">Apply patch to src/protocol.rs</text>

  <!-- Agent message -->
  <rect x="312" y="406" width="800" height="9" class="bar"/>
  <rect x="312" y="422" width="740" height="9" class="bar"/>
  <rect x="312" y="438" width="380" height="9" class="bar"/>
  <rect x="312" y="458" width="836" height="56" rx="4" fill="#252525"/>
  <rect x="326" y="470" width="200" height="8" class="bar"/>
  <rect x="326" y="484" width="220" height="8" class="bar"/>
  <rect x="326" y="498" width="180" height="8" class="bar"/>
  <use href="#copy" x="1136" y="526" width="12" height="12" class="icon-muted"/>

  <!-- Message editor -->
  <line x1="280" y1="560" x2="1180" y2="560" class="rule"/>
  <text x="300" y="590" class="mono muted">Message Ox — / for commands</text>
  <use href="#ring" x="878" y="668" width="12" height="12" class="icon-muted"/>
  <text x="898" y="678">glm-5.3-flash ⌄</text>
  <text x="1014" y="678">Default ⌄</text>
  <text x="1084" y="678">Ask ⌄</text>
  <use href="#send" x="1148" y="668" width="12" height="12" class="icon"/>

  <!-- Callouts -->
  <circle cx="22" cy="94" r="8" class="num"/><text x="22" y="98" class="num-text">1</text>
  <circle cx="22" cy="118" r="8" class="num"/><text x="22" y="122" class="num-text">2</text>
  <circle cx="1204" cy="64" r="8" class="num"/><text x="1204" y="68" class="num-text">3</text>
  <circle cx="1204" cy="114" r="8" class="num"/><text x="1204" y="118" class="num-text">4</text>
  <circle cx="1204" cy="241" r="8" class="num"/><text x="1204" y="245" class="num-text">5</text>
  <circle cx="1204" cy="310" r="8" class="num"/><text x="1204" y="314" class="num-text">6</text>
  <circle cx="1204" cy="532" r="8" class="num"/><text x="1204" y="536" class="num-text">7</text>
  <circle cx="1204" cy="586" r="8" class="num"/><text x="1204" y="590" class="num-text">8</text>
  <circle cx="1204" cy="674" r="8" class="num"/><text x="1204" y="678" class="num-text">9</text>

  <!-- Key -->
  <g font-size="11">
    <circle cx="48" cy="730" r="8" class="num"/><text x="48" y="734" class="num-text">1</text>
    <text x="64" y="734">Workspaces with sessions that need attention come first, with a count. + adds a workspace.</text>
    <circle cx="48" cy="754" r="8" class="num"/><text x="48" y="758" class="num-text">2</text>
    <text x="64" y="758">Status at the right edge: dot = needs permission, spinner = working, ! = failed. Bold = unread.</text>
    <circle cx="48" cy="778" r="8" class="num"/><text x="48" y="782" class="num-text">3</text>
    <text x="64" y="782">+ starts a new session in this session's workspace.</text>
    <circle cx="48" cy="802" r="8" class="num"/><text x="48" y="806" class="num-text">4</text>
    <text x="64" y="806">User messages sit in a box, in the buffer font.</text>
    <circle cx="48" cy="826" r="8" class="num"/><text x="48" y="830" class="num-text">5</text>
    <text x="64" y="830">Shell commands are filled blocks with the command in full.</text>
    <circle cx="640" cy="730" r="8" class="num"/><text x="640" y="734" class="num-text">6</text>
    <text x="656" y="734">Thinking and other tool calls are an icon and a title. Clicking one expands its content.</text>
    <circle cx="640" cy="754" r="8" class="num"/><text x="640" y="758" class="num-text">7</text>
    <text x="656" y="758">Copies the response to the clipboard as Markdown.</text>
    <circle cx="640" cy="778" r="8" class="num"/><text x="640" y="782" class="num-text">8</text>
    <text x="656" y="782">Typing / lists the slash commands Ox sends in available_commands_update.</text>
    <circle cx="640" cy="802" r="8" class="num"/><text x="640" y="806" class="num-text">9</text>
    <text x="656" y="806">Context ring (hover for tokens and cost), one picker per ACP config option, then Send.</text>
  </g>
</svg>
