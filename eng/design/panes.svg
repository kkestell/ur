<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="830" viewBox="0 0 1230 830" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#ccc">
  <defs>
    <style>
      .rule { stroke: #3a3a3a; fill: none; }
      .frame { stroke: #444; fill: #1e1e1e; }
      .bar { fill: #3a3a3a; }
      .muted { fill: #808080; }
      .bold { font-weight: 600; }
      .mono { font-family: Menlo, monospace; white-space: pre; }
      .num { fill: #1e1e1e; stroke: #999; }
      .num-text { font-size: 10px; text-anchor: middle; }
      .icon { color: #ccc; }
      .icon-muted { color: #808080; }
    </style>
    <symbol id="sparkle" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M6 .5 7.3 4.7 11.5 6 7.3 7.3 6 11.5 4.7 7.3 .5 6 4.7 4.7Z"/></symbol>
    <symbol id="bulb" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="5" r="3.5"/><path d="M4.5 10.5h3"/></symbol>
    <symbol id="search" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="5" cy="5" r="3.5"/><path d="M7.6 7.6 11 11"/></symbol>
    <symbol id="pencil" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1.5 10.5 2 8 8.5 1.5l2 2L4 10Z"/></symbol>
    <symbol id="plus" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></symbol>
    <symbol id="expand" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M7 1h4v4M5 11H1V7M11 1 7 5M1 11l4-4"/></symbol>
    <symbol id="dots" viewBox="0 0 12 12" fill="currentColor"><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/></symbol>
    <symbol id="send" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1 1.5 11 6 1 10.5 2.8 6Z"/></symbol>
    <symbol id="ring" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="5"/></symbol>
    <symbol id="target" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M6 .5v2.5M6 9v2.5M.5 6H3M9 6h2.5"/></symbol>
    <symbol id="copy" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><path d="M1.5 8V2.5a1 1 0 0 1 1-1H8"/></symbol>
    <symbol id="terminal" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M3 4.5 5 6 3 7.5M6 8h3"/></symbol>
    <symbol id="split" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M6 1.5v9"/></symbol>
    <symbol id="spinner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 2a4 4 0 1 1-4 4"/></symbol>
    <symbol id="cross" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3 3 9"/></symbol>
    <symbol id="alert" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="5"/><path d="M6 3.2v3.4M6 8.7v.1"/></symbol>
  </defs>

  <rect width="1230" height="830" fill="#151515"/>
  <rect x="40" y="20" width="1140" height="680" class="frame"/>

  <!-- Title bar -->
  <line x1="40" y1="48" x2="1180" y2="48" class="rule"/>
  <circle cx="58" cy="34" r="5" class="rule"/><circle cx="74" cy="34" r="5" class="rule"/><circle cx="90" cy="34" r="5" class="rule"/>
  <text x="112" y="38" class="bold">ur</text>


  <!-- Workspace panel -->
  <line x1="280" y1="48" x2="280" y2="700" class="rule"/>
  <text x="52" y="67" class="muted" font-size="11">Workspaces</text>
  <use href="#plus" x="256" y="58" width="11" height="11" class="icon-muted"/>

  <text x="52" y="98">▾</text><text x="66" y="98">site</text>
  <text x="266" y="98" text-anchor="end" class="muted">1</text>
  <line x1="58" y1="106" x2="58" y2="176" class="rule"/>
  <text x="72" y="122">Deploy script</text>
  <use href="#alert" x="256" y="112" width="12" height="12" class="icon"/>
  <rect x="41" y="130" width="238" height="24" fill="#2c2c2c"/>
  <text x="72" y="146">Update deps</text>
  <use href="#spinner" x="256" y="136" width="12" height="12" class="icon"/>
  <use href="#terminal" x="72" y="160" width="12" height="12" class="icon"/>
  <text x="90" y="170">npm run dev</text>

  <text x="52" y="202">▾</text><text x="66" y="202">ox</text>
  <line x1="58" y1="210" x2="58" y2="232" class="rule"/>
  <text x="72" y="226">Fix compaction cut</text>
  <use href="#spinner" x="256" y="216" width="12" height="12" class="icon"/>

  <text x="52" y="258">▸</text><text x="66" y="258">ur</text>

  <!-- Left pane: agent session -->
  <rect x="280" y="48" width="460" height="32" fill="#181818"/>
  <rect x="280" y="48" width="170" height="32" fill="#1e1e1e"/>
  <line x1="450" y1="48" x2="450" y2="80" class="rule"/>
  <line x1="450" y1="80" x2="740" y2="80" class="rule"/>
  <use href="#sparkle" x="294" y="58" width="12" height="12" class="icon"/>
  <text x="314" y="68">Update deps</text>
  <use href="#spinner" x="426" y="58" width="12" height="12" class="icon"/>
  <use href="#plus" x="694" y="58" width="12" height="12" class="icon"/>
  <use href="#split" x="716" y="58" width="12" height="12" class="icon"/>
  <line x1="740" y1="48" x2="740" y2="700" class="rule"/>

  <rect x="296" y="94" width="428" height="40" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="312" y="119" class="mono">Bump iced to 0.14 and fix the build.</text>
  <use href="#bulb" x="312" y="152" width="12" height="12" class="icon"/>
  <text x="332" y="162">Thinking</text>
  <rect x="312" y="180" width="412" height="50" rx="4" fill="#2a2a2a"/>
  <text x="326" y="198" class="mono muted" font-size="10.5">Run Command</text>
  <text x="326" y="219" class="mono">cargo update -p iced</text>
  <rect x="312" y="240" width="412" height="50" rx="4" fill="#2a2a2a"/>
  <text x="326" y="258" class="mono muted" font-size="10.5">Run Command</text>
  <text x="326" y="279" class="mono">cargo build</text>
  <rect x="312" y="308" width="400" height="9" class="bar"/>
  <rect x="312" y="324" width="300" height="9" class="bar"/>
  <use href="#pencil" x="316" y="353" width="12" height="12" class="icon"/>
  <text x="336" y="363">Apply patch to 2 files</text>

  <line x1="280" y1="560" x2="740" y2="560" class="rule"/>
  <text x="300" y="590" class="mono muted">Message agent — / for commands</text>
  <use href="#ring" x="440" y="668" width="12" height="12" class="icon-muted"/>
  <text x="458" y="678">glm-5.3-flash ⌄</text>
  <text x="574" y="678">Default ⌄</text>
  <text x="642" y="678">Auto ⌄</text>
  <rect x="709" y="669" width="10" height="10" fill="#ccc"/>

  <!-- Right top pane: terminal -->
  <rect x="740" y="48" width="440" height="32" fill="#181818"/>
  <rect x="740" y="48" width="170" height="32" fill="#1e1e1e"/>
  <line x1="910" y1="48" x2="910" y2="80" class="rule"/>
  <line x1="910" y1="80" x2="1180" y2="80" class="rule"/>
  <use href="#terminal" x="754" y="58" width="12" height="12" class="icon"/>
  <text x="774" y="68">npm run dev</text>
  <use href="#cross" x="886" y="58" width="12" height="12" class="icon"/>
  <use href="#plus" x="1134" y="58" width="12" height="12" class="icon"/>
  <use href="#split" x="1156" y="58" width="12" height="12" class="icon"/>
  <text x="756" y="104" class="mono" font-size="11">&gt; site@1.0.0 dev</text>
  <text x="756" y="120" class="mono" font-size="11">&gt; vite</text>
  <text x="756" y="152" class="mono" font-size="11">  VITE ready in 312 ms</text>
  <text x="756" y="168" class="mono" font-size="11">  Local: http://localhost:5173/</text>
  <text x="756" y="200" class="mono" font-size="11">[vite] hmr update /src/App.tsx</text>
  <rect x="756" y="208" width="7" height="12" fill="#ccc"/>

  <!-- Right bottom pane: failed agent session -->
  <line x1="740" y1="370" x2="1180" y2="370" class="rule"/>
  <rect x="740" y="370" width="440" height="32" fill="#181818"/>
  <rect x="740" y="370" width="170" height="32" fill="#1e1e1e"/>
  <line x1="910" y1="370" x2="910" y2="402" class="rule"/>
  <line x1="910" y1="402" x2="1180" y2="402" class="rule"/>
  <use href="#sparkle" x="754" y="380" width="12" height="12" class="icon"/>
  <text x="774" y="390">Deploy script</text>
  <use href="#alert" x="886" y="380" width="12" height="12" class="icon"/>
  <use href="#plus" x="1134" y="380" width="12" height="12" class="icon"/>
  <use href="#split" x="1156" y="380" width="12" height="12" class="icon"/>

  <rect x="756" y="416" width="408" height="36" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="772" y="439" class="mono">Write a deploy script for staging.</text>
  <use href="#pencil" x="776" y="475" width="12" height="12" class="icon"/>
  <text x="796" y="485">Apply patch to deploy.sh</text>
  <rect x="772" y="508" width="392" height="36" rx="4" fill="none" stroke="#3a3a3a"/>
  <use href="#alert" x="784" y="520" width="12" height="12" class="icon"/>
  <text x="804" y="530">OpenRouter returned 429 (rate limited)</text>

  <line x1="740" y1="580" x2="1180" y2="580" class="rule"/>
  <text x="756" y="606" class="mono muted">Message agent — / for commands</text>
  <use href="#ring" x="880" y="668" width="12" height="12" class="icon-muted"/>
  <text x="898" y="678">glm-5.3-flash ⌄</text>
  <text x="1014" y="678">Default ⌄</text>
  <text x="1084" y="678">Ask ⌄</text>
  <use href="#send" x="1148" y="668" width="12" height="12" class="icon"/>

  <!-- Split menu, open from the left pane's split button -->
  <rect x="712" y="54" width="20" height="20" rx="3" fill="#2c2c2c"/>
  <use href="#split" x="716" y="58" width="12" height="12" class="icon"/>
  <rect x="582" y="80" width="154" height="108" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="596" y="102">Split Right</text><text x="722" y="102" text-anchor="end" class="muted">⌘K →</text>
  <text x="596" y="126">Split Left</text><text x="722" y="126" text-anchor="end" class="muted">⌘K ←</text>
  <text x="596" y="150">Split Up</text><text x="722" y="150" text-anchor="end" class="muted">⌘K ↑</text>
  <text x="596" y="174">Split Down</text><text x="722" y="174" text-anchor="end" class="muted">⌘K ↓</text>

  <!-- Callouts -->
  <circle cx="22" cy="166" r="8" class="num"/><text x="22" y="170" class="num-text">1</text>
  <circle cx="470" cy="64" r="8" class="num"/><text x="470" y="68" class="num-text">2</text>
  <circle cx="672" cy="64" r="8" class="num"/><text x="672" y="68" class="num-text">3</text>
  <circle cx="752" cy="132" r="8" class="num"/><text x="752" y="136" class="num-text">4</text>
  <circle cx="1204" cy="160" r="8" class="num"/><text x="1204" y="164" class="num-text">5</text>
  <circle cx="1204" cy="526" r="8" class="num"/><text x="1204" y="530" class="num-text">6</text>

  <!-- Key -->
  <g font-size="11">
    <circle cx="48" cy="730" r="8" class="num"/><text x="48" y="734" class="num-text">1</text>
    <text x="64" y="734">Terminals belong to a workspace and are listed under it.</text>
    <circle cx="48" cy="754" r="8" class="num"/><text x="48" y="758" class="num-text">2</text>
    <text x="64" y="758">A tab shows its kind and status. Hovering shows Close Tab, which leaves it running.</text>
    <circle cx="48" cy="778" r="8" class="num"/><text x="48" y="782" class="num-text">3</text>
    <text x="64" y="782">+ opens New Session and New Terminal in the active tab's workspace.</text>
    <circle cx="640" cy="730" r="8" class="num"/><text x="640" y="734" class="num-text">4</text>
    <text x="656" y="734">Split opens this menu. Dragging a tab onto a pane edge also splits.</text>
    <circle cx="640" cy="754" r="8" class="num"/><text x="640" y="758" class="num-text">5</text>
    <text x="656" y="758">Closing the GUI leaves terminal applications running.</text>
    <circle cx="640" cy="778" r="8" class="num"/><text x="640" y="782" class="num-text">6</text>
    <text x="656" y="782">The error stays in the thread. The next prompt clears the Failed status.</text>
  </g>
</svg>
