<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="700" viewBox="0 0 1230 700" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#ccc">
  <defs>
    <style>
      .rule { stroke: #3a3a3a; fill: none; }
      .frame { stroke: #444; fill: #1e1e1e; }
      .bar { fill: #3a3a3a; }
      .muted { fill: #808080; }
      .bold { font-weight: 600; }
      .mono { font-family: Menlo, monospace; white-space: pre; }
      .num { fill: #1e1e1e; stroke: #999; }
      .num-text { font-size: 10px; text-anchor: middle; }
      .icon { color: #ccc; }
      .icon-muted { color: #808080; }
    </style>
    <symbol id="sparkle" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M6 .5 7.3 4.7 11.5 6 7.3 7.3 6 11.5 4.7 7.3 .5 6 4.7 4.7Z"/></symbol>
    <symbol id="bulb" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="5" r="3.5"/><path d="M4.5 10.5h3"/></symbol>
    <symbol id="search" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="5" cy="5" r="3.5"/><path d="M7.6 7.6 11 11"/></symbol>
    <symbol id="pencil" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1.5 10.5 2 8 8.5 1.5l2 2L4 10Z"/></symbol>
    <symbol id="plus" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></symbol>
    <symbol id="expand" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M7 1h4v4M5 11H1V7M11 1 7 5M1 11l4-4"/></symbol>
    <symbol id="dots" viewBox="0 0 12 12" fill="currentColor"><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/></symbol>
    <symbol id="send" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1 1.5 11 6 1 10.5 2.8 6Z"/></symbol>
    <symbol id="ring" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="5"/></symbol>
    <symbol id="target" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M6 .5v2.5M6 9v2.5M.5 6H3M9 6h2.5"/></symbol>
    <symbol id="copy" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><path d="M1.5 8V2.5a1 1 0 0 1 1-1H8"/></symbol>
    <symbol id="terminal" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M3 4.5 5 6 3 7.5M6 8h3"/></symbol>
    <symbol id="split" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M6 1.5v9"/></symbol>
    <symbol id="spinner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 2a4 4 0 1 1-4 4"/></symbol>
    <symbol id="cross" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3 3 9"/></symbol>
    <symbol id="alert" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="5"/><path d="M6 3.2v3.4M6 8.7v.1"/></symbol>
      <symbol id="image" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M.5 9 4 5.5 7 8.5 8.5 7 11.5 10"/><circle cx="8.5" cy="4.5" r="1"/></symbol>
    <symbol id="check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 4.8 9 10 3"/></symbol>
  </defs>

  <rect width="1230" height="700" fill="#151515"/>
  <!-- 1. Slash commands -->
  <circle cx="48" cy="36" r="8" class="num"/><text x="48" y="40" class="num-text">1</text>
  <text x="62" y="40" class="muted" font-size="11">Slash commands</text>
  <rect x="40" y="50" width="560" height="250" class="frame"/>
  <line x1="40" y1="160" x2="600" y2="160" class="rule"/>
  <rect x="56" y="70" width="420" height="9" class="bar"/>
  <rect x="56" y="86" width="300" height="9" class="bar"/>
  <rect x="56" y="58" width="400" height="96" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <rect x="57" y="63" width="398" height="24" fill="#2c2c2c"/>
  <text x="70" y="80" class="mono" xml:space="preserve">/compact</text><text x="160" y="80" class="muted">Compact the conversation context.</text>
  <text x="70" y="108" class="mono" xml:space="preserve">/review</text><text x="160" y="108" class="muted">Review uncommitted changes.</text>
  <text x="70" y="136" class="mono" xml:space="preserve">/plan</text><text x="160" y="136" class="muted">Write an implementation plan.</text>
  <text x="60" y="190" class="mono" xml:space="preserve">/</text>
  <rect x="69" y="179" width="1.5" height="14" fill="#ccc"/>
  <use href="#ring" x="298" y="268" width="12" height="12" class="icon-muted"/>
  <text x="318" y="278">glm-5.3-flash ⌄</text>
  <text x="434" y="278">Default ⌄</text>
  <text x="504" y="278">Ask ⌄</text>
  <use href="#send" x="568" y="268" width="12" height="12" class="icon"/>
  <!-- 2. Context ring -->
  <circle cx="628" cy="36" r="8" class="num"/><text x="628" y="40" class="num-text">2</text>
  <text x="642" y="40" class="muted" font-size="11">Context ring</text>
  <rect x="620" y="50" width="560" height="250" class="frame"/>
  <line x1="620" y1="160" x2="1180" y2="160" class="rule"/>
  <rect x="636" y="70" width="460" height="9" class="bar"/>
  <rect x="636" y="86" width="380" height="9" class="bar"/>
  <rect x="636" y="102" width="200" height="9" class="bar"/>
  <text x="640" y="190" class="mono" xml:space="preserve">Now update the README to match.</text>
  <text x="898" y="278">glm-5.3-flash ⌄</text>
  <text x="1014" y="278">Default ⌄</text>
  <text x="1084" y="278">Ask ⌄</text>
  <use href="#send" x="1148" y="268" width="12" height="12" class="icon"/>
  <circle cx="884" cy="274" r="5" fill="none" stroke="#444" stroke-width="1.4"/>
  <path d="M884 269 A5 5 0 0 1 886.4 278.4" fill="none" stroke="#ccc" stroke-width="1.4"/>
  <rect x="798" y="200" width="176" height="52" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="810" y="221">84k / 200k tokens (42%)</text>
  <text x="810" y="241" class="muted">Cost $1.27</text>
  <!-- 3. Config picker -->
  <circle cx="48" cy="336" r="8" class="num"/><text x="48" y="340" class="num-text">3</text>
  <text x="62" y="340" class="muted" font-size="11">Config picker</text>
  <rect x="40" y="350" width="560" height="250" class="frame"/>
  <line x1="40" y1="460" x2="600" y2="460" class="rule"/>
  <rect x="56" y="370" width="200" height="9" class="bar"/>
  <text x="60" y="490" class="mono" xml:space="preserve">Try this with a cheaper model.</text>
  <rect x="300" y="366" width="284" height="110" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <use href="#search" x="312" y="376" width="12" height="12" class="icon-muted"/>
  <text x="332" y="386" class="muted">Filter</text>
  <line x1="300" y1="396" x2="584" y2="396" class="rule"/>
  <text x="332" y="416">DeepSeek: DeepSeek V4.1 Flash</text>
  <rect x="301" y="424" width="282" height="24" fill="#2c2c2c"/>
  <use href="#check" x="312" y="430" width="12" height="12" class="icon"/>
  <text x="332" y="440">Z.ai: GLM 5.3 Flash</text>
  <text x="332" y="464">Meta: Muse Spark 1.3</text>
  <use href="#ring" x="298" y="568" width="12" height="12" class="icon-muted"/>
  <text x="318" y="578">glm-5.3-flash ⌄</text>
  <text x="434" y="578">Default ⌄</text>
  <text x="504" y="578">Ask ⌄</text>
  <use href="#send" x="568" y="568" width="12" height="12" class="icon"/>
  <!-- 4. Image attachment -->
  <circle cx="628" cy="336" r="8" class="num"/><text x="628" y="340" class="num-text">4</text>
  <text x="642" y="340" class="muted" font-size="11">Image attachment</text>
  <rect x="620" y="350" width="560" height="250" class="frame"/>
  <line x1="620" y1="460" x2="1180" y2="460" class="rule"/>
  <rect x="636" y="370" width="480" height="9" class="bar"/>
  <rect x="636" y="386" width="260" height="9" class="bar"/>
  <rect x="640" y="474" width="150" height="22" rx="3" fill="#333"/>
  <use href="#image" x="647" y="479" width="12" height="12" class="icon"/>
  <text x="665" y="489" font-size="11">screenshot.png</text>
  <use href="#cross" x="772" y="479" width="10" height="10" class="icon-muted"/>
  <text x="640" y="522" class="mono" xml:space="preserve">Match the error text to this screenshot.</text>
  <use href="#ring" x="878" y="568" width="12" height="12" class="icon-muted"/>
  <text x="898" y="578">glm-5.3-flash ⌄</text>
  <text x="1014" y="578">Default ⌄</text>
  <text x="1084" y="578">Ask ⌄</text>
  <use href="#send" x="1148" y="568" width="12" height="12" class="icon"/>

  <!-- Key -->
  <g font-size="11">
    <circle cx="48" cy="650" r="8" class="num"/><text x="48" y="654" class="num-text">1</text>
    <text x="64" y="654">Typing / lists /compact and Ox's skills from available_commands_update. Enter inserts one.</text>
    <circle cx="48" cy="674" r="8" class="num"/><text x="48" y="678" class="num-text">2</text>
    <text x="64" y="678">The ring fills with context use. Hovering shows tokens used, the context size, and the session's cost.</text>
    <circle cx="640" cy="650" r="8" class="num"/><text x="640" y="654" class="num-text">3</text>
    <text x="656" y="654">Each picker lists the option's values with their descriptions. Long lists get a filter field.</text>
    <circle cx="640" cy="674" r="8" class="num"/><text x="640" y="678" class="num-text">4</text>
    <text x="656" y="678">Dropping an image file on the editor attaches it to the next prompt. × removes it.</text>
  </g>
</svg>
