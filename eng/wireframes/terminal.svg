<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="870" viewBox="0 0 1230 870" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#ccc">
  <defs>
    <style>
      .rule { stroke: #3a3a3a; fill: none; }
      .frame { stroke: #444; fill: #1e1e1e; }
      .bar { fill: #3a3a3a; }
      .muted { fill: #808080; }
      .bold { font-weight: 600; }
      .mono { font-family: Menlo, monospace; white-space: pre; }
      .num { fill: #1e1e1e; stroke: #999; }
      .num-text { font-size: 10px; text-anchor: middle; }
      .icon { color: #ccc; }
      .icon-muted { color: #808080; }
    </style>
    <symbol id="sparkle" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M6 .5 7.3 4.7 11.5 6 7.3 7.3 6 11.5 4.7 7.3 .5 6 4.7 4.7Z"/></symbol>
    <symbol id="bulb" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="5" r="3.5"/><path d="M4.5 10.5h3"/></symbol>
    <symbol id="search" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="5" cy="5" r="3.5"/><path d="M7.6 7.6 11 11"/></symbol>
    <symbol id="pencil" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1.5 10.5 2 8 8.5 1.5l2 2L4 10Z"/></symbol>
    <symbol id="plus" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></symbol>
    <symbol id="expand" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M7 1h4v4M5 11H1V7M11 1 7 5M1 11l4-4"/></symbol>
    <symbol id="dots" viewBox="0 0 12 12" fill="currentColor"><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/></symbol>
    <symbol id="send" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M1 1.5 11 6 1 10.5 2.8 6Z"/></symbol>
    <symbol id="ring" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="5"/></symbol>
    <symbol id="target" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M6 .5v2.5M6 9v2.5M.5 6H3M9 6h2.5"/></symbol>
    <symbol id="copy" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><path d="M1.5 8V2.5a1 1 0 0 1 1-1H8"/></symbol>
    <symbol id="terminal" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M3 4.5 5 6 3 7.5M6 8h3"/></symbol>
    <symbol id="split" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M6 1.5v9"/></symbol>
    <symbol id="spinner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 2a4 4 0 1 1-4 4"/></symbol>
    <symbol id="cross" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3 3 9"/></symbol>
    <symbol id="alert" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="6" cy="6" r="5"/><path d="M6 3.2v3.4M6 8.7v.1"/></symbol>
      <symbol id="image" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><rect x=".5" y="1.5" width="11" height="9" rx="1"/><path d="M.5 9 4 5.5 7 8.5 8.5 7 11.5 10"/><circle cx="8.5" cy="4.5" r="1"/></symbol>
    <symbol id="check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 4.8 9 10 3"/></symbol>
  </defs>

  <rect width="1230" height="870" fill="#151515"/>
  <rect x="40" y="20" width="1140" height="680" class="frame"/>
  <line x1="40" y1="48" x2="1180" y2="48" class="rule"/>
  <circle cx="58" cy="34" r="5" class="rule"/><circle cx="74" cy="34" r="5" class="rule"/><circle cx="90" cy="34" r="5" class="rule"/>
  <text x="112" y="38" class="bold">ur</text>

  <!-- Workspace panel -->
  <line x1="280" y1="48" x2="280" y2="700" class="rule"/>
  <text x="52" y="67" class="muted" font-size="11">Workspaces</text>
  <use href="#plus" x="256" y="58" width="11" height="11" class="icon-muted"/>
  <text x="52" y="98">▾</text><text x="66" y="98">site</text>
  <text x="266" y="98" class="muted" text-anchor="end">1</text>
  <line x1="58" y1="106" x2="58" y2="176" class="rule"/>
  <text x="72" y="122">Deploy script</text>
  <use href="#alert" x="256" y="112" width="12" height="12" class="icon"/>
  <text x="72" y="146">Update deps</text>
  <use href="#spinner" x="256" y="136" width="12" height="12" class="icon"/>
  <rect x="41" y="154" width="238" height="24" fill="#2c2c2c"/>
  <use href="#terminal" x="72" y="160" width="12" height="12" class="icon"/>
  <text x="90" y="170">npm run dev</text>
  <text x="52" y="202">▾</text><text x="66" y="202">ox</text>
  <text x="266" y="202" class="muted" text-anchor="end">1</text>
  <line x1="58" y1="210" x2="58" y2="256" class="rule"/>
  <text x="72" y="226">Add subagents review</text>
  <circle cx="262" cy="222" r="3.5" fill="#74ade8"/>
  <text x="72" y="250">Fix compaction cut</text>
  <use href="#spinner" x="256" y="240" width="12" height="12" class="icon"/>
  <rect x="41" y="266" width="238" height="24" fill="#2c2c2c"/>
  <text x="52" y="282">▾</text><text x="66" y="282">ur</text>
  <line x1="58" y1="290" x2="58" y2="336" class="rule"/>
  <text x="72" y="306">Plan milestone 2</text>
  <use href="#terminal" x="72" y="320" width="12" height="12" class="icon"/>
  <text x="90" y="330">zsh</text>
  <rect x="96" y="292" width="180" height="92" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="110" y="313">New Session</text>
  <text x="110" y="337">New Terminal</text>
  <line x1="96" y1="350" x2="276" y2="350" class="rule"/>
  <text x="110" y="373">Remove Workspace</text>

  <!-- Terminal header -->
  <use href="#terminal" x="296" y="58" width="12" height="12" class="icon"/>
  <text x="316" y="68">npm run dev</text>
  <line x1="280" y1="80" x2="1180" y2="80" class="rule"/>

  <!-- Terminal -->
  <text x="296" y="104" class="mono" font-size="11" xml:space="preserve">$ npm run dev</text>
  <text x="296" y="136" class="mono" font-size="11" xml:space="preserve">&gt; site@1.0.0 dev</text>
  <text x="296" y="152" class="mono" font-size="11" xml:space="preserve">&gt; vite</text>
  <text x="296" y="184" class="mono" font-size="11" xml:space="preserve">  VITE v7.1.3  ready in 312 ms</text>
  <text x="296" y="216" class="mono" font-size="11" xml:space="preserve">  ➜  Local:   http://localhost:5173/</text>
  <text x="296" y="232" class="mono" font-size="11" xml:space="preserve">  ➜  Network: use --host to expose</text>
  <text x="296" y="264" class="mono" font-size="11" xml:space="preserve">10:42:07 AM [vite] hmr update /src/App.tsx</text>
  <text x="296" y="280" class="mono" font-size="11" xml:space="preserve">10:44:51 AM [vite] hmr update /src/App.tsx, /src/index.css</text>
  <text x="296" y="296" class="mono" font-size="11" xml:space="preserve">10:45:02 AM [vite] page reload src/main.tsx</text>
  <rect x="296" y="302" width="7" height="12" fill="#ccc"/>

  <!-- Callouts -->
  <circle cx="22" cy="170" r="8" class="num"/><text x="22" y="174" class="num-text">1</text>
  <circle cx="1204" cy="64" r="8" class="num"/><text x="1204" y="68" class="num-text">2</text>
  <circle cx="1204" cy="200" r="8" class="num"/><text x="1204" y="204" class="num-text">3</text>
  <circle cx="22" cy="338" r="8" class="num"/><text x="22" y="342" class="num-text">4</text>

  <!-- Key -->
  <g font-size="11">
    <circle cx="48" cy="730" r="8" class="num"/><text x="48" y="734" class="num-text">1</text>
    <text x="64" y="734">Terminals are listed under their workspace, after its sessions. A terminal has no status.</text>
    <circle cx="48" cy="754" r="8" class="num"/><text x="48" y="758" class="num-text">2</text>
    <text x="64" y="758">The header shows the terminal's title, set by the program running in it.</text>
    <circle cx="640" cy="730" r="8" class="num"/><text x="640" y="734" class="num-text">3</text>
    <text x="656" y="734">Returning to a terminal restores its running app's screen.</text>
    <circle cx="640" cy="754" r="8" class="num"/><text x="640" y="758" class="num-text">4</text>
    <text x="656" y="758">The workspace menu gains New Terminal, which starts a login shell in the workspace directory.</text>
  </g>
  <!-- Separate example of the terminal sidebar context menu -->
  <text x="40" y="798" class="muted" font-size="11">Terminal menu (right-click its sidebar row)</text>
  <rect x="40" y="810" width="200" height="32" rx="4" fill="#252525" stroke="#3a3a3a"/>
  <text x="54" y="831">Close Terminal</text>
  <text x="270" y="831" font-size="11">Stops this terminal. Closing its tab only removes it from the layout.</text>
</svg>
