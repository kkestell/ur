[workspace]
members = ["crates/ur", "crates/ur-client", "crates/ur-fake-server", "app/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
agent-client-protocol = "2.1.0"
# The version `agent-client-protocol` pins, so these are the SDK's own types.
agent-client-protocol-schema = { version = "=1.7.0", default-features = false }
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-wdio-webdriver = "1.2.0"
tempfile = "3.27.0"
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
ts-rs = "12.0.1"
ur-client = { path = "crates/ur-client" }
ur-fake-server = { path = "crates/ur-fake-server" }
vt100 = "0.16.2"
