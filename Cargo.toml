[workspace]
members = ["crates/ur", "crates/ur-fake-server"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
agent-client-protocol = "2.1.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
ur-fake-server = { path = "crates/ur-fake-server" }

# Dependencies build without debug info. Workspace crates keep file and line
# numbers for panics and backtraces, and `packed` collects them into a `.dSYM`
# so object files are not left in `target/` after each link.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
